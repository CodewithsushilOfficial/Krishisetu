<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="tomatoGrad" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff6b6b"/>
      <stop offset="45%" stop-color="#e02e2e"/>
      <stop offset="90%" stop-color="#b01313"/>
      <stop offset="100%" stop-color="#800a0a"/>
    </radialGradient>
    <radialGradient id="highlight" cx="30%" cy="25%" r="20%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="stemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#40c057"/>
      <stop offset="100%" stop-color="#2b8a3e"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#7a0a0a" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Transparent background for crisp table inline rendering -->
  <g filter="url(#shadow)" transform="translate(0, 15)">
    <!-- Tomato body -->
    <ellipse cx="170" cy="225" rx="100" ry="115" fill="url(#tomatoGrad)"/>
    <ellipse cx="230" cy="225" rx="100" ry="115" fill="url(#tomatoGrad)"/>
    <ellipse cx="200" cy="235" rx="115" ry="110" fill="url(#tomatoGrad)"/>
    <!-- Specular highlight -->
    <ellipse cx="150" cy="180" rx="45" ry="30" fill="url(#highlight)" transform="rotate(-20 150 180)"/>
    <!-- Stem / Calyx -->
    <path d="M195,130 C195,100 205,75 220,70 C215,85 210,105 205,130 Z" fill="url(#stemGrad)"/>
    <!-- Leaves -->
    <path d="M200,130 Q160,110 135,125 Q160,135 195,135 Z" fill="url(#stemGrad)"/>
    <path d="M200,130 Q240,105 265,120 Q235,135 205,135 Z" fill="url(#stemGrad)"/>
    <path d="M200,130 Q185,155 180,175 Q195,150 200,130 Z" fill="url(#stemGrad)"/>
    <path d="M200,130 Q215,155 220,175 Q205,150 200,130 Z" fill="url(#stemGrad)"/>
    <path d="M200,130 Q195,95 190,80 Q205,105 200,130 Z" fill="url(#stemGrad)"/>
  </g>
</svg>
