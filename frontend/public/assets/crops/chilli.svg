<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <radialGradient id="chilliGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="25%" stop-color="#22c55e"/>
      <stop offset="70%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </radialGradient>
    <radialGradient id="stemGrad" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#bbf7d0"/>
      <stop offset="50%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#15803d"/>
    </radialGradient>
    <filter id="chilliShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#14532d" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Transparent background for crisp table inline rendering -->
  <g filter="url(#chilliShadow)" transform="translate(10, 10)">
    <!-- Green Cap / Calyx -->
    <path d="M 170 120 C 180 90 220 90 230 120 C 210 135 190 135 170 120 Z" fill="url(#stemGrad)"/>
    <!-- Stem -->
    <path d="M 200 100 Q 215 65 240 55" stroke="url(#stemGrad)" stroke-width="8" stroke-linecap="round" fill="none"/>
    <!-- Curved Chilli Body -->
    <path d="M 175 125 C 160 180 180 250 220 300 C 235 320 250 330 255 330 C 255 325 240 280 230 220 C 225 180 228 140 225 125 Z" fill="url(#chilliGrad)"/>
    <!-- Shiny specular highlight -->
    <path d="M 185 140 C 180 180 195 240 225 285" stroke="#bbf7d0" stroke-width="6" stroke-linecap="round" fill="none" opacity="0.6"/>
  </g>
</svg>
