<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 140" width="100%" height="100%">
  <defs>
    <linearGradient id="cabOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff7a18"/>
      <stop offset="60%" stop-color="#e65100"/>
      <stop offset="100%" stop-color="#bf360c"/>
    </linearGradient>
    <linearGradient id="metalBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f5f5f5"/>
      <stop offset="50%" stop-color="#e0e0e0"/>
      <stop offset="100%" stop-color="#bdbdbd"/>
    </linearGradient>
    <linearGradient id="windshield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#90caf9"/>
      <stop offset="100%" stop-color="#1e88e5"/>
    </linearGradient>
  </defs>
  <!-- Shadow -->
  <ellipse cx="120" cy="128" rx="100" ry="8" fill="#000" opacity="0.18"/>
  <!-- Container Body -->
  <rect x="25" y="24" width="125" height="78" rx="3" fill="url(#metalBody)" stroke="#9e9e9e" stroke-width="1.5"/>
  <line x1="45" y1="24" x2="45" y2="102" stroke="#bdbdbd" stroke-width="1"/>
  <line x1="75" y1="24" x2="75" y2="102" stroke="#bdbdbd" stroke-width="1"/>
  <line x1="105" y1="24" x2="105" y2="102" stroke="#bdbdbd" stroke-width="1"/>
  <line x1="130" y1="24" x2="130" y2="102" stroke="#bdbdbd" stroke-width="1"/>
  <rect x="35" y="48" width="70" height="24" rx="2" fill="#2e7d32" opacity="0.9"/>
  <text x="70" y="64" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="900" text-anchor="middle">KrishiSetu</text>
  <!-- Truck Cabin (Orange) -->
  <path d="M148,40 L178,40 Q188,40 192,48 L206,75 Q210,82 210,90 L210,102 L148,102 Z" fill="url(#cabOrange)"/>
  <!-- Windshield -->
  <path d="M174,44 L187,44 Q191,44 194,50 L202,68 L174,68 Z" fill="url(#windshield)" opacity="0.85"/>
  <!-- Side Window -->
  <rect x="153" y="45" width="17" height="23" rx="2" fill="url(#windshield)" opacity="0.85"/>
  <!-- Headlight & Bumper -->
  <rect x="204" y="86" width="6" height="10" rx="2" fill="#fff9c4"/>
  <rect x="195" y="98" width="18" height="10" rx="2" fill="#424242"/>
  <!-- Fuel Tank & Chassis -->
  <rect x="65" y="100" width="35" height="12" rx="3" fill="#616161"/>
  <rect x="22" y="102" width="130" height="6" fill="#212121"/>
  <!-- Wheels -->
  <!-- Wheel 1 (Rear Back) -->
  <circle cx="48" cy="112" r="16" fill="#212121"/>
  <circle cx="48" cy="112" r="9" fill="#9e9e9e"/>
  <circle cx="48" cy="112" r="4" fill="#424242"/>
  <!-- Wheel 2 (Rear Front) -->
  <circle cx="85" cy="112" r="16" fill="#212121"/>
  <circle cx="85" cy="112" r="9" fill="#9e9e9e"/>
  <circle cx="85" cy="112" r="4" fill="#424242"/>
  <!-- Wheel 3 (Front) -->
  <circle cx="178" cy="112" r="16" fill="#212121"/>
  <circle cx="178" cy="112" r="9" fill="#9e9e9e"/>
  <circle cx="178" cy="112" r="4" fill="#424242"/>
</svg>
