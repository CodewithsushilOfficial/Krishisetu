<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 140" width="100%" height="100%">
  <defs>
    <linearGradient id="eicherOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff8a50"/>
      <stop offset="50%" stop-color="#e64a19"/>
      <stop offset="100%" stop-color="#d84315"/>
    </linearGradient>
    <linearGradient id="heavyContainer" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#eceff1"/>
      <stop offset="100%" stop-color="#b0bec5"/>
    </linearGradient>
    <linearGradient id="eicherGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b3e5fc"/>
      <stop offset="100%" stop-color="#0288d1"/>
    </linearGradient>
  </defs>
  <ellipse cx="120" cy="128" rx="105" ry="8" fill="#000" opacity="0.18"/>
  <!-- Multi-axle Heavy Cargo Box -->
  <rect x="20" y="20" width="135" height="82" rx="3" fill="url(#heavyContainer)" stroke="#78909c" stroke-width="1.5"/>
  <line x1="50" y1="20" x2="50" y2="102" stroke="#90a4ae" stroke-width="1"/>
  <line x1="85" y1="20" x2="85" y2="102" stroke="#90a4ae" stroke-width="1"/>
  <line x1="120" y1="20" x2="120" y2="102" stroke="#90a4ae" stroke-width="1"/>
  <!-- Heavy Reefer Unit on top of box -->
  <rect x="22" y="14" width="30" height="8" rx="2" fill="#37474f"/>
  <rect x="30" y="46" width="75" height="24" rx="2" fill="#1565c0" opacity="0.9"/>
  <text x="67" y="62" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="900" text-anchor="middle">ColdChain Reefer</text>
  <!-- Cabin (Eicher heavy) -->
  <path d="M152,32 L185,32 Q194,32 198,40 L212,72 Q216,80 216,90 L216,102 L152,102 Z" fill="url(#eicherOrange)"/>
  <path d="M180,36 L192,36 Q196,36 199,44 L208,66 L180,66 Z" fill="url(#eicherGlass)" opacity="0.85"/>
  <rect x="158,38" width="18" height="26" rx="2" fill="url(#eicherGlass)" opacity="0.85"/>
  <rect x="210" y="85" width="6" height="10" rx="2" fill="#fff59d"/>
  <rect x="202" y="98" width="16" height="10" rx="2" fill="#263238"/>
  <rect x="68" y="100" width="40" height="12" rx="3" fill="#546e7a"/>
  <!-- 4 Wheels for heavy multi-axle -->
  <circle cx="42" cy="112" r="16" fill="#212121"/>
  <circle cx="42" cy="112" r="9" fill="#9e9e9e"/>
  <circle cx="75" cy="112" r="16" fill="#212121"/>
  <circle cx="75" cy="112" r="9" fill="#9e9e9e"/>
  <circle cx="108" cy="112" r="16" fill="#212121"/>
  <circle cx="108" cy="112" r="9" fill="#9e9e9e"/>
  <circle cx="184" cy="112" r="16" fill="#212121"/>
  <circle cx="184" cy="112" r="9" fill="#9e9e9e"/>
</svg>
