version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # Database: PostgreSQL 15 (Platform Data Store)
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: krishisetu-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-krishisetu}
    ports:
      - '5432:5432'
    volumes:
      - krishisetu_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Cache & Queue: Redis 7
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: krishisetu-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # AI Microservices: Python + FastAPI
  # ---------------------------------------------------------------------------
  ai-services:
    build:
      context: ./ai-services
      dockerfile: Dockerfile
    container_name: krishisetu-ai-services
    restart: unless-stopped
    environment:
      - ENVIRONMENT=development
      - PORT=8000
      - HOST=0.0.0.0
      - AI_SERVICE_API_KEY=${AI_SERVICE_API_KEY:-krishisetu-internal-ai-key-secret}
    ports:
      - '8000:8000'
    volumes:
      - ./ai-services:/app

  # ---------------------------------------------------------------------------
  # Backend API: Node.js + Express + Prisma
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: krishisetu-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - PORT=5000
      - NODE_ENV=development
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/krishisetu?schema=public
      - REDIS_URL=redis://redis:6379
      - AI_SERVICE_URL=http://ai-services:8000
      - AI_SERVICE_API_KEY=${AI_SERVICE_API_KEY:-krishisetu-internal-ai-key-secret}
      - JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET:-dev-secret-access-token-krishisetu-2026}
      - JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET:-dev-secret-refresh-token-krishisetu-2026}
    ports:
      - '5000:5000'
    volumes:
      - ./backend:/app
      - /app/node_modules

  # ---------------------------------------------------------------------------
  # Frontend: React 18 + Vite
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: krishisetu-frontend
    restart: unless-stopped
    ports:
      - '5173:5173'
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  krishisetu_postgres_data:
  redis_data:
